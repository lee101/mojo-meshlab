[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-meshlab"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
libc = "2.39"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.1.0.dev2026081105"
python = "3.12.*"
pytest = "*"
numpy = "*"

[pypi-dependencies]
pymeshlab = "==2023.12.post2"
